name: Build Speakit

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign, notarize and package
        env:
          MACOS_CERT_APP_P12: ${{ secrets.MACOS_CERT_APP_P12 }}
          MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: VERSION=$(sed -nE 's/^project\(SPEAKIT VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt) installer/mac_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Speakit-mac
          path: |
            out/Speakit_mac.dmg
            out/Speakit_mac_VST3.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(SPEAKIT VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\speakit.iss
          Compress-Archive -Path build\SPEAKIT_artefacts\Release\VST3\Speakit.vst3 -DestinationPath Speakit_win_VST3.zip
          Move-Item installer\Output\Speakit_win_setup.exe Speakit_win_setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Speakit-windows
          path: |
            Speakit_win_setup.exe
            Speakit_win_VST3.zip

