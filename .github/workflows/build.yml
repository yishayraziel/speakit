name: Build Anal-Log

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Sign, notarize and package
        env:
          MACOS_CERT_APP_P12: ${{ secrets.MACOS_CERT_APP_P12 }}
          MACOS_CERT_INSTALLER_P12: ${{ secrets.MACOS_CERT_INSTALLER_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: VERSION=$(sed -nE 's/^project\(SPEAKIT VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt) installer/mac_package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Anal-Log-mac
          path: |
            out/Anal-Log_mac.dmg
            out/Anal-Log_mac_VST3.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake --version
          cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(SPEAKIT VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\speakit.iss
          Compress-Archive -Path build\SPEAKIT_artefacts\Release\VST3\Anal-Log.vst3 -DestinationPath Anal-Log_win_VST3.zip
          Move-Item installer\Output\Anal-Log_win_setup.exe Anal-Log_win_setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Anal-Log-windows
          path: |
            Anal-Log_win_setup.exe
            Anal-Log_win_VST3.zip


  release:
    # a v* tag, or a push to main whose commit message contains [release], publishes a GitHub Release
    # named after the version in CMakeLists.txt. yraziel.com/anal-log links to releases/latest/download/<file>
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          cp THIRD_PARTY_NOTICES.txt dist/
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(sed -nE 's/^project\(SPEAKIT VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)"; fi
          echo "TAG=$TAG"
          cat > notes.md <<NOTES
          Anal-Log ${TAG}: free speaker, phone and radio simulator by Yishay Raziel.

          - **Mac:** \`Anal-Log_mac.dmg\` (VST3, AU and standalone app; Apple Silicon + Intel; signed and notarized).
          - **Windows:** \`Anal-Log_win_setup.exe\` (64-bit). If SmartScreen warns, click More info, then Run anyway.
          - VST3 only: \`Anal-Log_mac_VST3.zip\`, \`Anal-Log_win_VST3.zip\`.

          Page: https://yraziel.com/anal-log/ · Credits and licenses: \`THIRD_PARTY_NOTICES.txt\`.
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Anal-Log ${TAG#v}" --notes-file notes.md \
            dist/Anal-Log_mac.dmg dist/Anal-Log_mac_VST3.zip dist/Anal-Log_win_setup.exe dist/Anal-Log_win_VST3.zip dist/THIRD_PARTY_NOTICES.txt
